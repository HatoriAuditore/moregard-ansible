stages:
  - validate
  - configure

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

variables:
  ANSIBLE_HOST_KEY_CHECKING: "false"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  ANSIBLE_INVENTORY_FILE: "inventory/hosts.ini"
  ANSIBLE_PLAYBOOK_FILE: "playbooks/bootstrap_linux.yml"
  ANSIBLE_EXTRA_VARS_FILE: "ansible-extra-vars.json"

cache:
  key: "ansible-$CI_PROJECT_ID"
  paths:
    - .cache/pip/

validate:
  stage: validate
  tags:
    - ansible-runner
  before_script:
    - export HTTP_PROXY="${HTTP_PROXY:-${CI_HTTP_PROXY:-}}"
    - export HTTPS_PROXY="${HTTPS_PROXY:-${CI_HTTPS_PROXY:-$HTTP_PROXY}}"
    - export NO_PROXY="${NO_PROXY:-${CI_NO_PROXY:-127.0.0.1,localhost}}"
    - export http_proxy="$HTTP_PROXY"
    - export https_proxy="$HTTPS_PROXY"
    - export no_proxy="$NO_PROXY"
    - python3 -m pip install --upgrade pip
    - python3 -m pip install "ansible>=10,<11"
    - export PATH="$HOME/.local/bin:$PATH"
    - which ansible
    - which ansible-playbook
    - ansible --version
    - |
      if [ -n "$ANSIBLE_EXTRA_VARS_JSON" ]; then
        printf '%s' "$ANSIBLE_EXTRA_VARS_JSON" > "$ANSIBLE_EXTRA_VARS_FILE"
      fi
    - python3 scripts/sync_inventory.py "$ANSIBLE_INVENTORY_FILE"
  script:
    - |
      EXTRA_VARS_ARGS=""
      if [ -f "$ANSIBLE_EXTRA_VARS_FILE" ]; then
        EXTRA_VARS_ARGS="-e @$ANSIBLE_EXTRA_VARS_FILE"
      fi
      ansible-playbook --syntax-check -i "$ANSIBLE_INVENTORY_FILE" "${ANSIBLE_PLAYBOOK:-$ANSIBLE_PLAYBOOK_FILE}" --limit "${ANSIBLE_LIMIT:-all}" $EXTRA_VARS_ARGS

configure:
  stage: configure
  tags:
    - ansible-runner
  before_script:
    - export HTTP_PROXY="${HTTP_PROXY:-${CI_HTTP_PROXY:-}}"
    - export HTTPS_PROXY="${HTTPS_PROXY:-${CI_HTTPS_PROXY:-$HTTP_PROXY}}"
    - export NO_PROXY="${NO_PROXY:-${CI_NO_PROXY:-127.0.0.1,localhost}}"
    - export http_proxy="$HTTP_PROXY"
    - export https_proxy="$HTTPS_PROXY"
    - export no_proxy="$NO_PROXY"
    - python3 -m pip install --upgrade pip
    - python3 -m pip install "ansible>=10,<11"
    - export PATH="$HOME/.local/bin:$PATH"
    - which ansible
    - which ansible-playbook
    - ansible --version
    - |
      if [ -n "$ANSIBLE_EXTRA_VARS_JSON" ]; then
        printf '%s' "$ANSIBLE_EXTRA_VARS_JSON" > "$ANSIBLE_EXTRA_VARS_FILE"
      fi
    - python3 scripts/sync_inventory.py "$ANSIBLE_INVENTORY_FILE"
  script:
    - |
      EXTRA_VARS_ARGS=""
      if [ -f "$ANSIBLE_EXTRA_VARS_FILE" ]; then
        EXTRA_VARS_ARGS="-e @$ANSIBLE_EXTRA_VARS_FILE"
      fi
      ansible-playbook -i "$ANSIBLE_INVENTORY_FILE" "${ANSIBLE_PLAYBOOK:-$ANSIBLE_PLAYBOOK_FILE}" --limit "${ANSIBLE_LIMIT:-all}" -e "vm_request_id=${VM_REQUEST_ID:-manual}" -e "vm_requested_by=${VM_REQUESTED_BY:-unknown}" -e "vm_operation=${VM_OPERATION:-manual}" -e "vm_names=${VM_NAMES:-}" -e "vm_names_json=${VM_NAMES_JSON:-[]}" $EXTRA_VARS_ARGS
