---
- name: Install vsftpd
  ansible.builtin.dnf:
    name: vsftpd
    state: present

- name: Ensure vsftpd is enabled and running
  ansible.builtin.service:
    name: vsftpd
    enabled: true
    state: started

- name: Deploy basic vsftpd configuration
  ansible.builtin.copy:
    dest: /etc/vsftpd/vsftpd.conf
    mode: "0600"
    content: |
      anonymous_enable=NO
      local_enable=YES
      write_enable=YES
      local_umask=022
      dirmessage_enable=YES
      xferlog_enable=YES
      connect_from_port_20=YES
      xferlog_std_format=YES
      listen=NO
      listen_ipv6=YES
      pam_service_name=vsftpd
      userlist_enable=YES
      tcp_wrappers=YES
